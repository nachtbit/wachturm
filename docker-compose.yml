services:
  postgres:
    image: postgres:16-alpine
    container_name: wachturm-postgres
    environment:
      POSTGRES_DB: wachturm
      POSTGRES_USER: wachturm
      POSTGRES_PASSWORD: wachturm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wachturm -d wachturm"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/wachturm.api/Dockerfile
    container_name: wachturm-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=wachturm;Username=wachturm;Password=wachturm
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/wachturm.worker/Dockerfile
    container_name: wachturm-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=wachturm;Username=wachturm;Password=wachturm
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres-data:
